<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Farm Lab</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/panels.css">
</head>
<body>
  <div class="app-container">
    <main class="game-area">
      <div id="canvas-container">
        <canvas id="game-canvas"></canvas>
      </div>
      <div class="bottom-controls">
        <button class="btn btn-primary" id="btn-run" type="button">Run</button>
        <button class="btn btn-secondary" id="btn-step" type="button">Step</button>
        <button class="btn btn-danger" id="btn-stop" type="button">Stop</button>
        <button class="btn btn-warning" id="btn-reset" type="button">Reset</button>
      </div>
    </main>

    <aside class="side-panel">
      <header class="panel-header">
        <h1>Code Farm Lab</h1>
        <p class="subtitle">Code-driven farm automation</p>
      </header>

      <div class="panel-section">
        <div class="mission-bar">Mission: <span class="highlight">Build a movement program</span></div>
        <div class="status-bar">Status: <span class="status-value" data-state="stopped">stopped</span></div>
        <div class="stats-bar">
          Coins: <span class="highlight" data-coins>20</span>
          | Score: <span class="highlight" data-score>0</span>
        </div>
      </div>

      <div class="panel-section block-shop">
        <h3>Block Shop</h3>
        <div class="block-list" data-shop-list></div>
        <h3 class="subheading">Owned Blocks</h3>
        <div class="owned-list" data-owned-list></div>
      </div>

      <div class="panel-section program-area">
        <div class="section-title-row">
          <h3>Program</h3>
          <button class="mini-btn" data-clear-program type="button">Clear Program</button>
        </div>
        <div class="program-list" data-program-list></div>
      </div>

      <div class="panel-section code-preview">
        <h3>Code Preview</h3>
        <pre><code data-code-preview># Add blocks to build a program</code></pre>
      </div>

      <div class="panel-section log-area">
        <h3>Log</h3>
        <div class="log-content">System initialized...</div>
      </div>
    </aside>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
